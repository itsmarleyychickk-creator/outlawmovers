<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Outlaw Movers • Administrator login</title><link rel="stylesheet" href="./style.css"></head><body><main class="customer-main"><header><strong>OUTLAW MOVERS LLC</strong><span>Private online office</span></header><div id="content"><h1>Administrator login</h1><p>Sign in with your verified, authorized account. Records and documents are private.</p><section class="panel"><form id="login"><label class="field">Email<input name="email" type="email" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" minlength="12" autocomplete="current-password" required></label><p id="error" role="status"></p><button class="primary">Sign in</button><button type="button" id="create-account">Create my account</button><button type="button" id="reset-password">Reset password</button><button type="button" id="update-password" hidden>Save new password</button></form></section><p>First visit: create your account, confirm the email, then sign in. Only approved, verified accounts can open office records.</p><a href="/">Public website</a></div></main><script type="module" src="./client.js"></script></body></html>
